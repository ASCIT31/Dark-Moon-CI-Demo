name: darkmoon-template

on:
  workflow_call:
    inputs:
      prompt:
        description: "Target (e.g. TARGET: 172.18.0.3)"
        required: true
        type: string
      remediate:
        description: "Open fix pull requests for the findings after the pentest"
        required: false
        default: false
        type: boolean
      remediation_repo:
        description: "Git repo (URL) whose source the target was built from"
        required: false
        default: ""
        type: string
      remediation_provider:
        description: "SCM provider (github|gitlab|gitea|gogs|bitbucket|azure_devops)"
        required: false
        default: "github"
        type: string

    secrets:
      DARKMOON_LICENSE_KEY:
        required: true
      OPENROUTER_PROVIDER:
        required: true
      OPENCODE_MODEL:
        required: true
      OPENROUTER_API_KEY:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      REMEDIATION_SCM_TOKEN:
        required: false

jobs:
  darkmoon-headless:
    runs-on: darkmoon-runner-demo

    steps:
      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Download & install Darkmoon
        run: |
          curl -fsSL https://client.dark-moon.org/install.sh -o install.sh
          chmod +x install.sh
          ./install.sh "${{ secrets.DARKMOON_LICENSE_KEY }}" \
            --provider "${{ secrets.OPENROUTER_PROVIDER }}" \
            --model "${{ secrets.OPENCODE_MODEL }}" \
            --api-key "${{ secrets.OPENROUTER_API_KEY }}"

      - name: Run pentest
        run: |
          echo "[CI] Darkmoon pentest in progress..."
          ./darkmoon.sh run --agent pentest "${{ inputs.prompt }}"

      - name: Remediate findings (open fix pull requests)
        if: ${{ inputs.remediate && inputs.remediation_repo != '' }}
        run: |
          echo "[CI] Darkmoon remediation — opening fix pull requests for review..."
          # Invokes the installed Darkmoon product's remediation command. The push
          # token is provided via env and is never printed.
          docker exec \
            -e DARKMOON_SCM_TOKEN="${{ secrets.REMEDIATION_SCM_TOKEN }}" \
            -e OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
            -e OPENCODE_MODEL="${{ secrets.OPENCODE_MODEL }}" \
            -e OPENROUTER_PROVIDER="${{ secrets.OPENROUTER_PROVIDER }}" \
            opencode bash -lc "cd /opt/darkmoon/mcp/server && python -m src.remediation \
              --latest-campaign --api-base http://127.0.0.1:8000/api/v1 \
              --repo '${{ inputs.remediation_repo }}' \
              --provider '${{ inputs.remediation_provider }}' \
              --min-confidence 0.7 --no-link" | tee remediation-summary.json || true
          echo "--- remediation summary ---"; cat remediation-summary.json || true

      - name: Upload remediation summary
        if: ${{ inputs.remediate && inputs.remediation_repo != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: darkmoon-remediation-${{ github.run_id }}
          path: remediation-summary.json

      - name: Collect reports from container
        if: always()
        run: |
          rm -rf reports && mkdir -p reports
          for f in $(docker exec opencode bash -c "ls /opt/darkmoon/mcp/server/data/reports/*.md 2>/dev/null"); do
            docker exec opencode cat "$f" > "reports/$(basename $f)"
          done
          ls -la reports/ || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darkmoon-reports-${{ github.run_id }}
          path: reports/
